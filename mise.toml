[tools]
go = "1.27.4"

[tasks.dev]
description = "Run ups from source"
run = "go run ."

[tasks.test]
description = "Vet and test"
run = ["go vet ./...", "go test ./..."]

[tasks.build]
description = "Build ./bin/ups"
run = "go build -o bin/ups ."

[tasks.install]
description = "Build and install ups to ~/.local/bin (on PATH)"
run = "go build -o ~/.local/bin/ups ."
